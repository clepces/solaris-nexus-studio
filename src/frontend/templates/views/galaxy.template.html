      <!-- ======================================================================
           VISTA 5: GALAXY FORGE & TOPOLOGY VIEWER
           ====================================================================== -->
      <section id="tab-galaxy" class="view-panel">
        <div class="galaxy-workspace-layout">
          <!-- Lienzo Táctico -->
          <div class="reagle-card-panel" style="padding: 14px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <h3 style="font-size: 0.95rem; font-weight: 800;">Lienzo Táctico de Topología Estelar</h3>
              <div style="display: flex; gap: 6px;">
                <button class="btn-reagle" data-action="galaxy:generate" data-players="8">8P</button>
                <button class="btn-reagle btn-reagle-primary" data-action="galaxy:generate" data-players="12">12P</button>
                <button class="btn-reagle" data-action="galaxy:generate" data-players="16">16P</button>
              </div>
            </div>

            <div class="galaxy-canvas-container">
              <canvas id="galaxy-canvas" width="680" height="420"></canvas>
            </div>

            <!-- Leyenda Táctica -->
            <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 0.74rem; color: var(--text-secondary); justify-content: center;">
              <span><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#f59e0b; margin-right:4px;"></span>Estrella</span>
              <span><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; margin-right:4px;"></span>Terran</span>
              <span><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#eab308; margin-right:4px;"></span>Desert</span>
              <span><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#38bdf8; margin-right:4px;"></span>Ice</span>
              <span><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#ef4444; margin-right:4px;"></span>Volcanic</span>
              <span><span style="display:inline-block; width:12px; height:2px; background:rgba(56, 189, 248, 0.7); margin-right:4px; vertical-align:middle;"></span>Línea de Fase</span>
            </div>
          </div>

          <!-- Inspector y Nodos -->
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div class="reagle-card-panel" style="padding: 12px;">
              <div style="font-weight: 800; font-size: 0.90rem; color: var(--text-blue);" id="galaxy-scenario-name">Solaris_Ring_12P</div>
              <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; font-size: 0.76rem; color: var(--text-secondary);">
                <div>Estrellas: <strong id="galaxy-star-count" style="color: var(--text-main);">1</strong></div>
                <div>Planetas: <strong id="galaxy-planet-count" style="color: var(--text-main);">12</strong></div>
                <div>Líneas: <strong id="galaxy-lane-count" style="color: var(--text-main);">13</strong></div>
              </div>
              <div style="margin-top: 8px;">
                <span class="metric-badge-pill" id="galaxy-connectivity-badge">● Grafo 100% Conexo (BFS OK)</span>
              </div>
            </div>

            <div class="reagle-card-panel" style="padding: 12px; flex: 1;">
              <div style="font-weight: 700; font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 6px;">Inspector de Planeta Seleccionado</div>
              <div id="galaxy-selected-info" style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px;">
                <em>Haz clic en un planeta del listado o lienzo para inspeccionarlo.</em>
              </div>
              <div style="font-weight: 700; font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 4px;">Listado de Nodos</div>
              <div class="galaxy-nodes-scroll" id="galaxy-nodes-list"></div>
            </div>
          </div>
        </div>
      </section>
